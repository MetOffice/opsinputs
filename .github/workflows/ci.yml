---
name: UKMO Integration Test

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      test-tier:
        description: test tier
      image-tag:
        description: container image tag
        required: true
        default: develop
      refs:
        description: "override package refs, (e.g., oops:bugfix/this,ufo:bugfix/that)"

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install linters
        run: |
          python3 -m pip install cmakelint fortitude-lint
      - name: Run cmakelint
        run: |
          mapfile -t names < <(find -name 'CMakeLists.txt' -o -name '*.cmake')
          cmakelint "${names[@]}"
      - name: Run fortitude check
        run: |
          fortitude check

  build:
    name: gnu-openmpi
    if: |
      github.repository_owner == 'MetOffice' && (
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false
        ) || (
          github.event_name == 'workflow_dispatch'
        )
      )
    runs-on:
      group: mo-jedi-rg
      labels: jedi-self-hosted-rg
    env:
      MOBB_CI_PR_BODY_OUT: mobb-ci-gh-pr-body.out
      REPO: ${{ github.event.repository.name }}
      TIMEOUT_MINUTE: 301

    steps:
      - name: Define NAMESPACE (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          echo "NAMESPACE=ci-${{github.event_name}}-${{github.event.number}}" >>"${GITHUB_ENV}"

      - name: Define NAMESPACE (not pull_request)
        if: github.event_name != 'pull_request'
        run: |
          echo "NAMESPACE=ci-${{github.event_name}}" >>"${GITHUB_ENV}"

      - name: Cleanup (pre)
        run: |
          rm -fr "./${NAMESPACE}"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: ./${{ env.NAMESPACE }}

      - name: Set CI variables (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          gh pr view --json 'body' --jq '.body' --repo "${GITHUB_REPOSITORY}" \
            "${GITHUB_HEAD_REF}" >"./${MOBB_CI_PR_BODY_OUT}"
          image_tag="${GITHUB_BASE_REF##*/}"
          declare -A settings
          settings['MOBB_CI_IMAGE_TAG']="${image_tag}"
          settings['MOBB_CI_TEST_TIER']='1'
          for name in "${!settings[@]}"; do
            default="${settings[${name}]}"
            value="$( \
              sed -n \
              -e 's/^[[:space:]]*'"${name}"'=\([^[:space:]]\+\).*$/\1/p' \
              "./${MOBB_CI_PR_BODY_OUT}")"
            value="${value:-${default}}"
            echo "${name}=${value}"
          done >>"${GITHUB_ENV}"

      - name: Set CI variables (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo 'MOBB_CI_TEST_TIER=${{ inputs.ci-test-tier }}' >>"${GITHUB_ENV}"
          echo 'MOBB_CI_IMAGE_TAG=${{ inputs.image-tag }}' >>"${GITHUB_ENV}"
          echo 'MOBB_CI_REFS=${{ inputs.refs }}' >>"${GITHUB_ENV}"

      - name: Run
        run: |
          docker run --rm \
            --name "${REPO}-${NAMESPACE}-${GITHUB_SHA::7}" \
            --volume "./${MOBB_CI_PR_BODY_OUT}:/var/tmp/${MOBB_CI_PR_BODY_OUT}" \
            --volume "./${NAMESPACE}:/var/tmp/mobb-ci-${NAMESPACE}" \
            --volume '/testdata/mobb-data:/var/tmp/mobb-data' \
            --env GH_TOKEN="${{ secrets.GH_PAT }}" \
            --env GITHUB_HEAD_REF="${GITHUB_HEAD_REF}" \
            --env GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            --env MOBB_CI_PR_BODY_OUT="/var/tmp/${MOBB_CI_PR_BODY_OUT}" \
            --env MOBB_CI_REFS="${MOBB_CI_REFS:-}" \
            --env MOBB_CI_TEST_TIER="${MOBB_CI_TEST_TIER}" \
            --env MOBB_DATA='/var/tmp/mobb-data' \
            --env REPO="${REPO}" \
            --entrypoint '/usr/bin/env' \
            --workdir="/var/tmp/mobb-ci-${NAMESPACE}" \
            "ngmssboxjediacr.azurecr.io/jedibase:${MOBB_CI_IMAGE_TAG}" \
            'timeout' "$((TIMEOUT_MINUTE - 1))m" '/usr/local/bin/mobb-ci'
        timeout-minutes: ${{ fromJSON(env.TIMEOUT_MINUTE) }}

      - name: Cleanup (post)
        run: rm -fr "./${NAMESPACE}"
