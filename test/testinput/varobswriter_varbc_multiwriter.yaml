time window:
  begin: 2018-01-01T00:00:00Z
  end: 2018-01-01T02:00:00Z

observations:
  - obs space:
      name: ATMS
      obsdatain:
        engine:
          type: H5File
          obsfile: Data/varobs_globalnamelist_atms.nc4
      simulated variables: [brightnessTemperature]
      channels: 1, 3
    obs filters:
    - filter: VarObs Writer
      output_varbc_predictors: true
      general_mode: debug
    - filter: VarObs Checker
      expected_varfields: ["80"]
    # This second writer defaults output_varbc_predictors to false.
    - filter: VarObs Writer
      output_directory: testoutput/varbc_default_false
      general_mode: debug
    HofX: ObsValue
    benchmarkFlag: 1000
    flaggedBenchmark: 0
